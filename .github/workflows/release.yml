name: Release

# Run this workflow with version 1.2.0 (or push a tag like v1.2.0) to publish Lanternfish 1.2.0.N, where N is the
# major version of the Jellyfin it is built against: main builds for Jellyfin 12 (1.2.0.12), the 13 branch for
# Jellyfin 13 (1.2.0.13). It builds the plugin zip, attaches it to a GitHub release tagged v1.2.0.N and adds it to
# manifest.json, the plugin repository Jellyfin installs and updates from. Jellyfin installs the highest version
# whose targetAbi it meets, so each server picks the build for its own Jellyfin version.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.2.0 (the Jellyfin version is added as the fourth number)
        required: true

env:
  BASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Jellyfin plugin versions have four parts; the build step adds the fourth, the Jellyfin major version. Checked
      # first, so a mistyped version fails in seconds rather than after the tests (as a .NET restore error)
      - name: Version
        id: version
        run: |
          version="${BASE_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must look like 1.2.0, not '${BASE_VERSION#v}': the fourth number is the Jellyfin version, added automatically"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test JellyFlix.slnx

      - name: Build
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The Jellyfin version the plugin is built against, e.g. 12.2.0.0
          abi="$(grep -oP 'AssemblyVersion\("\K[0-9.]+' jellyfin-server/SharedVersion.cs).0"
          version="${VERSION}.${abi%%.*}"
          dotnet build src/JellyFlix -c Release -p:Version="${version}" -p:AssemblyVersion="${version}" -p:FileVersion="${version}"
          (cd src/JellyFlix/bin/Release/net10.0 && zip -q "${GITHUB_WORKSPACE}/lanternfish_${version}.zip" JellyFlix.dll)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "abi=${abi}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          gh release create "${TAG}" "lanternfish_${VERSION}.zip" \
            --target "${GITHUB_SHA}" --title "Lanternfish ${VERSION}" --generate-notes

      - name: Update plugin repository
        env:
          VERSION: ${{ steps.build.outputs.version }}
          ABI: ${{ steps.build.outputs.abi }}
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/lanternfish_${VERSION}.zip"
          git fetch origin main && git checkout main
          python3 scripts/update_manifest.py manifest.json "lanternfish_${VERSION}.zip" "${VERSION}" "${url}" "${ABI}" "See https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Add Lanternfish ${VERSION} (Jellyfin ${ABI%%.*}) to the plugin repository"
          git push origin main
