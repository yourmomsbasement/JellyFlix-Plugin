name: Release

# Push a tag like v1.2.0, or run this workflow with version 1.2.0 (or 1.2.0.0), to publish Lanternfish 1.2.0.0: builds the plugin
# zip, attaches it to a GitHub release and adds it to manifest.json, the plugin repository Jellyfin installs and
# updates from.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.2.0 (or 1.2.0.0)
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Jellyfin plugin versions have four parts: 1.2.0 becomes 1.2.0.0, and 1.2.0.0 is used as given. Checked first,
      # so a mistyped version fails in seconds rather than after the tests (as a .NET restore error)
      - name: Version
        id: version
        run: |
          version="${TAG#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="${version}.0"
          elif [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must look like 1.2.0 or 1.2.0.0, not '${TAG#v}'"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test JellyFlix.slnx

      - name: Build
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          version="${VERSION}"
          # The Jellyfin version the plugin is built against, e.g. 13.0.0.0
          abi="$(grep -oP 'AssemblyVersion\("\K[0-9.]+' jellyfin-server/SharedVersion.cs).0"
          dotnet build src/JellyFlix -c Release -p:Version="${version}" -p:AssemblyVersion="${version}" -p:FileVersion="${version}"
          (cd src/JellyFlix/bin/Release/net10.0 && zip -q "${GITHUB_WORKSPACE}/lanternfish_${version}.zip" JellyFlix.dll)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "abi=${abi}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          gh release create "${TAG}" "lanternfish_${VERSION}.zip" \
            --target "${GITHUB_SHA}" --title "Lanternfish ${VERSION}" --generate-notes

      - name: Update plugin repository
        env:
          VERSION: ${{ steps.build.outputs.version }}
          ABI: ${{ steps.build.outputs.abi }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/lanternfish_${VERSION}.zip"
          git fetch origin main && git checkout main
          python3 scripts/update_manifest.py manifest.json "lanternfish_${VERSION}.zip" "${VERSION}" "${url}" "${ABI}" "See https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Add Lanternfish ${VERSION} to the plugin repository"
          git push origin main
